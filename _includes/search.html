<div class="search-dialog" id="search-dialog" role="dialog" aria-modal="true" aria-label="Пошук статей" hidden data-search-dialog>
  <button class="search-backdrop" type="button" aria-label="Закрити пошук" data-search-close></button>
  <div class="search-panel">
    <div class="search-field">
      <span class="ui-icon ui-search" aria-hidden="true"></span>
      <input type="search"
             placeholder="Шукати статтю, тему, маршрут або команду…"
             autocomplete="off"
             aria-controls="search-results"
             aria-autocomplete="list"
             data-search-input>
      <button type="button" data-search-close aria-label="Закрити пошук">ESC</button>
    </div>
    <div class="search-results" id="search-results" role="listbox" aria-label="Результати пошуку" aria-live="polite" data-search-results>
      <p class="search-hint">Почніть вводити запит — наприклад, AI, .NET або Azure.</p>
    </div>
    <div class="search-shortcuts" aria-hidden="true">
      <span><kbd>↑</kbd><kbd>↓</kbd> навігація</span>
      <span><kbd>↵</kbd> відкрити</span>
      <span><kbd>esc</kbd> закрити</span>
    </div>
    <div class="search-source" hidden>
      {% for post in site.posts %}
        <a href="{{ post.url | relative_url }}"
           data-search-item
           data-title="{{ post.title | escape }}"
           data-topics="{{ post.categories | join: ' ' | escape }} {{ post.tags | join: ' ' | escape }}"
           data-path="{{ post.learning_path.title | default: '' | escape }}"
           data-level="{{ post.content_meta.level | default: '' | escape }}"
           data-date="{{ post.date | date: '%d.%m.%Y' }}">
          {{ post.excerpt | strip_html | strip_newlines | truncate: 180 | escape }}
        </a>
      {% endfor %}
    </div>
  </div>
</div>
