---
layout: default
---
<section class="page-hero shell">
  <h1>Теми</h1>
  <p>Технології, патерни та інженерні практики, про які я пишу.</p>
</section>
<section class="taxonomy-grid shell">
  {% assign categories = site.categories | sort %}
  {% for category in categories %}
    {% assign category_slug = category[0] | slugify %}
    <a class="taxonomy-card" href="{{ '/categories/' | append: category_slug | append: '/' | relative_url }}">
      <h2>{{ category[0] }}</h2>
      <p>{{ category[1].size }}</p>
    </a>
  {% endfor %}
</section>
