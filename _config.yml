# Site
lang: uk-UA
timezone: Europe/Kiev
title: Taras Kovalenko
tagline: Engineering Notes — .NET, AI та архітектура
description: >-
  Практичні нотатки про .NET, архітектуру програмного забезпечення,
  хмарні платформи, продуктивність та AI-інженерію.
url: "https://taraskovalenko.github.io"
baseurl: ""

# Author
avatar: /assets/img/avatar.jpg
github:
  username: TarasKovalenko
social:
  name: Taras Kovalenko
  email: bad.kto@gmail.com
  links:
    - https://bsky.app/profile/tkovalenko.bsky.social
    - https://github.com/TarasKovalenko
    - https://www.facebook.com/tkovalenko.official
    - https://www.linkedin.com/in/taras-kovalenko

# Metadata and analytics
social_preview_image: /assets/img/social/og-engineering-notes.png
analytics:
  google:
    id: G-0JQ6R7CHZF

comments:
  provider: utterances
  utterances:
    repo: TarasKovalenko/taraskovalenko.github.io
    issue_term: pathname

# Local development
livereload: true
reload_port: 35729
force_polling: true

# Build plugins
plugins:
  - jekyll-archives
  - jekyll-sitemap

kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

collections:
  tabs:
    output: true
    sort_by: order
  posts_en:
    output: true
    permalink: /en/posts/:path/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      toc: true
      # Public compatibility contract: do not change existing article URLs.
      permalink: /posts/:title/
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/
  - scope:
      path: ""
      type: posts_en
    values:
      layout: post
      lang: en
      locale: en_US
      toc: true

sass:
  style: compressed

exclude:
  - _site
  - .jekyll-cache
  - "*.gem"
  - "*.gemspec"
  - docs
  - examples
  - tools
  - README.md
  - LICENSE
  - task_plan.md
  - findings.md
  - progress.md
  - CONTENT_TODO.md

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/
